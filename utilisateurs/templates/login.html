{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'assets/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'secondapp/style.css' %}">
    
</head>
<body>
    <main>
        <div class="content">
            <div class="autre">
                <div class="img">
                    <img src="{% static 'assets/facebook.png'%}" alt="user" id="rs">
                </div>
                    <p><a href="{% url 'verification' %}">Mot de passe oublié ?</a><a href="{% url 'creation' %}">J'ai ne pas de compte</a></p>
            </div>
            <div class="form-connect">
                <form action="" method="post">
                    {% csrf_token %}
                    <h3>Connection</h3>
                    {% if messages %}
                        {% for message in messages %}
                            <h5 class="alert alert-danger" role="alert">
                                {{ message }}
                            </h5>
                        {% endfor %}
                    {% endif %}
                    <input type="text" placeholder="Entrez un nom d'utilisateur" name="username" id="username">
                    <input type="password" placeholder="Entrez un mot de passe" name="password" id="password">
                    <button type="submit">Se Connecter</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
